<header>
  <a routerLink="/" class="logo">
    <strong>NotiFlash</strong>
    <span>| Noticias al instante</span>
  </a>

  <button class="menu-btn d-lg-none" type="button" (click)="toggleMenu()" aria-label="Abrir menú">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="21" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <nav [class.abierto]="menuAbierto" class="d-lg-flex">
    <a routerLink="/inicio" routerLinkActive="activo" [routerLinkActiveOptions]="{exact: true}" (click)="menuAbierto = false">Inicio</a>
    <a routerLink="/noticias" routerLinkActive="activo" (click)="menuAbierto = false">Noticias</a>
    <a routerLink="/favoritos" routerLinkActive="activo" (click)="menuAbierto = false">
      Favoritos
      <span class="badge-fav" *ngIf="cantidadFavoritos > 0">{{ cantidadFavoritos }}</span>
    </a>
    <a routerLink="/gestionar" routerLinkActive="activo" (click)="menuAbierto = false">Gestionar</a>
    <a routerLink="/contacto" routerLinkActive="activo" (click)="menuAbierto = false">Contacto</a>

    <form class="buscador" role="search" (submit)="buscar(); $event.preventDefault()">
      <input
        type="text"
        placeholder="Buscar..."
        [(ngModel)]="terminoBusqueda"
        name="busqueda"
        aria-label="Buscar"
      >
      <button type="submit" aria-label="Buscar">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/>
          <line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
      </button>
    </form>
  </nav>
</header>
